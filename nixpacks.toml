# Nixpacks configuration to enforce pure Python 3.10 pipeline on Hostless Cloud
[phases.setup]
nixPkgs = ["python310", "gcc"]

[phases.install]
cmds = ["python -m pip install --prefer-binary --no-cache-dir -r backend/requirements.txt"]

[start]
cmd = "uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
