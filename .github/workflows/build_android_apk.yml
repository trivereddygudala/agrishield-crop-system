name: Build Standalone Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build_android_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package AgriShield AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Node Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build Production Frontend with Edge AI Assets
        working-directory: ./frontend
        env:
          VITE_API_URL: ""
        run: |
          npm run build
          test -d dist && echo "✅ Frontend production build ready."

      - name: Bundle Web Assets into Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/dist/. android/app/src/main/assets/public/
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "Generated local.properties with sdk.dir=$ANDROID_HOME"
          cat android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log || {
            echo "::error file=android/app/build.gradle::Gradle build failed."
            echo "=== FULL GRADLE FAILURE LOG ==="
            cat gradle_build.log
            exit 1
          }

      - name: Rename & Verify APK
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/AgriShield-AI-v1.0-Offline.apk \;
          ls -lh output_apk/

      - name: Upload Standalone Offline APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriShield-AI-Offline-Android-APK
          path: output_apk/AgriShield-AI-v1.0-Offline.apk
          if-no-files-found: error
          retention-days: 30
