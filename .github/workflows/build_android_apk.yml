name: Build Standalone Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'frontend/**'
      - '.github/workflows/build_android_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package AgriShield AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Production Frontend with Edge AI Assets
        working-directory: frontend
        run: npm run build

      - name: Bundle Web Assets into Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/dist/* android/app/src/main/assets/public/
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename & Verify APK
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/AgriShield-AI-v1.0-Offline.apk \;
          ls -lh output_apk/

      - name: Upload Standalone Offline APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriShield-AI-Offline-Android-APK
          path: output_apk/AgriShield-AI-v1.0-Offline.apk
          if-no-files-found: error
          retention-days: 30
