name: Agri Shield CI/CD Pipeline & Build Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  validate-yaml:
    name: YAML Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyYAML Validator
        run: pip install pyyaml

      - name: Validate Docker Compose & CI YAML
        run: |
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('*.yml') + glob.glob('.github/workflows/*.yml')]"
          echo "✅ All YAML files validated successfully."

  backend-test:
    name: Backend Unit Tests & Verification
    runs-on: ubuntu-latest
    needs: validate-yaml
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python System & Compilation Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r backend/requirements.txt sentence-transformers faiss-cpu pypdf pytest pytest-asyncio httpx

      - name: Execute Backend Unit Tests
        env:
          ENV: "development"
          HOST: "127.0.0.1"
          PORT: "8000"
          DEBUG: "True"
          JWT_SECRET_KEY: "test_secret_key_ci_cd_pipeline_mock_key_2026_minimum_32_chars"
          REFRESH_TOKEN_SECRET_KEY: "test_refresh_secret_key_ci_cd_pipeline_mock_key_2026_32_chars"
          IOT_API_KEY: "test_iot_api_key_ci_cd_2026"
          IOT_SECURITY_MODE: "development"
          MONGODB_URI: "mongodb://localhost:27017"
          DATABASE_NAME: "test_crop_disease_db"
          UPLOAD_DIR: "uploads"
        run: |
          PYTHONPATH=. pytest backend/ -v --maxfail=1

  frontend-build:
    name: Frontend SPA Build Verification
    runs-on: ubuntu-latest
    needs: validate-yaml
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Node Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Execute Frontend Production Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ""
        run: |
          npm run build
          test -d dist && echo "✅ Frontend SPA build verified: dist directory generated successfully."

  docker-verify:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: agrishield-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Frontend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: agrishield-frontend:test
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Compose Configuration Syntax
        run: |
          docker compose config -q
          echo "✅ Docker Compose syntax and multi-stage container orchestration verified."
