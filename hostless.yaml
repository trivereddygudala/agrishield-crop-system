# Hostless Cloud Configuration for AgriShield AI Worker Node
name: agrishield-worker-1

build:
  builder: nixpacks
  buildCommand: pip install --prefer-binary --no-cache-dir -r backend/requirements.txt

run:
  command: uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}
  healthcheckPath: /api/v1/health

deploy:
  startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port ${PORT:-8000}
  healthcheckPath: /api/v1/health
  restartPolicyType: ON_FAILURE
